name: Probe Three

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx cap add android
      - run: node scripts/patch-manifest.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: six-string-bootcamp-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
