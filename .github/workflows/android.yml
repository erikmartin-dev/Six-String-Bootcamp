# re-trigger parse check
name: Android build

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  debug-apk:
    # Installable test build. No signing needed — sideload it straight to your phone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx cap add android
      - run: node scripts/patch-manifest.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: six-string-bootcamp-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    # Play Store bundle. Skipped until signing secrets exist (see mobile/README.md):
    # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for signing secrets
        id: signing
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — release build skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.present == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.present == 'true'
        with: { distribution: temurin, java-version: 17 }
        if: steps.signing.outputs.present == 'true'
      - run: npm ci
        if: steps.signing.outputs.present == 'true'
      - run: npx cap add android
        if: steps.signing.outputs.present == 'true'
      - run: node scripts/patch-manifest.js
        if: steps.signing.outputs.present == 'true'
      - run: npx cap sync android
        if: steps.signing.outputs.present == 'true'
      - run: chmod +x android/gradlew
        if: steps.signing.outputs.present == 'true'
      - name: Decode keystore
        if: steps.signing.outputs.present == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload.keystore
      - name: Build signed release bundle
        if: steps.signing.outputs.present == 'true'
        run: cd android && ./gradlew bundleRelease
            -Pandroid.injected.signing.store.file=$PWD/upload.keystore
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}'
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}'
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}'
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.present == 'true'
        with:
          name: six-string-bootcamp-release
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
